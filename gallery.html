<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Visual gallery for the Hidden Waters thesis project.">

<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="icon" href="assets/images/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

<title>Gallery · Hidden Waters</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
@font-face{
    font-family:"Steelfish";
    src:url("assets/fonts/steelfish-rg.otf") format("opentype");
    font-style:normal;
    font-weight:400;
    font-display:swap;
}

@font-face{
    font-family:"Steelfish";
    src:url("assets/fonts/steelfish-rg-it.otf") format("opentype");
    font-style:italic;
    font-weight:400;
    font-display:swap;
}

:root{
    --background:#050505;
    --text:#f2f2f2;
    --muted:#a6a6a6;
    --blue:#739da6;
    --blue-light:#8fb3ba;
    --line:rgba(255,255,255,.11);
    --header-background:rgba(5,5,5,.78);
    --content-width:1100px;
    --content-gutter:128px;
    --header-height:76px;
    --gallery-gap:24px;
    --radius:24px;
}

*{box-sizing:border-box}

html{
    scroll-behavior:smooth;
    scroll-padding-top:110px;
}

body{
    margin:0;
    overflow-x:hidden;
    color:var(--text);
    background:var(--background);
    font-family:"Inter",Arial,sans-serif;
    line-height:1.65;
}

a{
    color:inherit;
    text-decoration:none;
}

button{font:inherit}

img,video{
    display:block;
    width:100%;
}

.content-width{
    width:min(var(--content-width),calc(100% - var(--content-gutter)));
    margin-inline:auto;
}

/* HEADER */

.site-header{
    position:fixed;
    z-index:1000;
    inset:0 0 auto;
    height:var(--header-height);
    background:var(--header-background);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(150%);
    -webkit-backdrop-filter:blur(18px) saturate(150%);
}

.header-content{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100%;
}

.main-nav{
    display:flex;
    align-items:center;
    gap:30px;
    font-family:"Bebas Neue",sans-serif;
    font-size:1.28rem;
    letter-spacing:.12em;
    line-height:1;
}

.main-nav>a:not(.header-logo-link){
    position:relative;
    transition:color .22s ease,transform .22s ease;
}

.main-nav>a:not(.header-logo-link)::after{
    content:"";
    position:absolute;
    right:0;
    bottom:-7px;
    left:0;
    height:1px;
    background:var(--blue-light);
    transform:scaleX(0);
    transform-origin:right;
    transition:transform .24s ease;
}

.main-nav>a:hover,
.main-nav>a:focus-visible{
    color:var(--blue-light);
}

.main-nav>a:not(.header-logo-link):hover,
.main-nav>a:not(.header-logo-link):focus-visible{
    transform:translateY(-1px);
}

.main-nav>a:not(.header-logo-link):hover::after,
.main-nav>a:not(.header-logo-link):focus-visible::after,
.main-nav>a[aria-current="page"]::after{
    transform:scaleX(1);
    transform-origin:left;
}

.header-logo-link{
    display:flex;
    justify-content:center;
    align-items:center;
    width:42px;
    height:52px;
    flex:0 0 42px;
    opacity:.94;
    transition:opacity .22s ease,transform .26s ease;
}

.header-logo-link:hover,
.header-logo-link:focus-visible{
    opacity:1;
    transform:scale(1.07);
}

.header-logo-image{
    width:auto;
    height:40px;
    max-width:38px;
    object-fit:contain;
}

/* PT / EN */

.language-switch{
    position:absolute;
    top:50%;
    right:0;
    display:flex;
    gap:3px;
    padding:4px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    transform:translateY(-50%);
}

.language-button{
    min-width:36px;
    padding:6px 9px;
    color:#8f8f8f;
    background:transparent;
    border:0;
    border-radius:999px;
    cursor:pointer;
    font-family:"Bebas Neue",sans-serif;
    font-size:.9rem;
    letter-spacing:.08em;
}

.language-button.is-active{
    color:#050505;
    background:var(--blue-light);
}

.language-button:hover:not(.is-active){color:#fff}

main{padding-top:var(--header-height)}

/* HERO */

.gallery-hero{
    padding:clamp(55px,7vh,95px) 0 clamp(90px,11vh,135px);
}

.gallery-title{
    margin:0;
    color:#eee;
    font-family:"Bebas Neue",sans-serif;
    font-size:clamp(5rem,11vw,11rem);
    font-weight:400;
    letter-spacing:.01em;
    line-height:.8;
}

.gallery-introduction{
    max-width:690px;
    margin:42px 0 0;
    color:var(--muted);
    font-size:.98rem;
    line-height:1.78;
}

/* SECTIONS */

.gallery-sections{
    padding-bottom:clamp(110px,14vh,180px);
}

.gallery-section{
    margin-bottom:clamp(120px,16vh,195px);
    scroll-margin-top:110px;
}

.gallery-section:last-child{margin-bottom:0}

.gallery-section-header{
    display:grid;
    grid-template-columns:auto minmax(80px,1fr);
    align-items:center;
    gap:30px;
    margin-bottom:34px;
}

.gallery-section-link{
    display:inline-flex;
    align-items:baseline;
    gap:8px;
    width:fit-content;
    color:var(--blue-light);
    font-family:"Steelfish","Arial Narrow",sans-serif;
    font-size:clamp(1.55rem,2.2vw,2rem);
    letter-spacing:.045em;
    line-height:1;
    text-transform:uppercase;
    transition:color .22s ease,transform .22s ease;
}

.gallery-section-link .arrow{
    font-size:.72em;
    opacity:.8;
}

.gallery-section-link:hover,
.gallery-section-link:focus-visible{
    color:#fff;
    transform:translateY(-1px);
}

.gallery-section-line{
    height:1px;
    background:linear-gradient(
        to right,
        rgba(143,179,186,.5),
        rgba(143,179,186,.035)
    );
}

/* DYNAMIC ARTBOOK */

.gallery-layout{width:100%}

.gallery-layout--single{
    display:block;
}

.gallery-layout--single .gallery-card{
    width:100%;
}

.gallery-layout--pair{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    align-items:start;
    gap:var(--gallery-gap);
}

.gallery-layout--masonry{
    column-count:2;
    column-gap:var(--gallery-gap);
}

.gallery-layout--masonry .gallery-card{
    display:inline-block;
    width:100%;
    margin:0 0 var(--gallery-gap);
    break-inside:avoid;
}

/* CARDS */

.gallery-card{
    position:relative;
    padding:0;
    overflow:hidden;
    color:#fff;
    background:#18292d;
    border:0;
    border-radius:var(--radius);
    cursor:zoom-in;
    text-align:left;
    isolation:isolate;
    transition:
        transform .42s cubic-bezier(.22,1,.36,1),
        box-shadow .42s ease;
}

.gallery-card img{
    width:100%;
    height:auto;
    border-radius:inherit;
    object-fit:contain;
    transition:
        transform .7s cubic-bezier(.22,1,.36,1),
        filter .48s ease;
}

.gallery-card::after{
    content:"";
    position:absolute;
    z-index:1;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.54) 0%,
        rgba(0,0,0,.08) 40%,
        transparent 68%
    );
    opacity:0;
    pointer-events:none;
    transition:opacity .33s ease;
}

.gallery-card:hover,
.gallery-card:focus-visible{
    z-index:20;
    transform:translateY(-4px) scale(1.012);
    box-shadow:0 25px 65px rgba(0,0,0,.46);
}

.gallery-card:hover::after,
.gallery-card:focus-visible::after{
    opacity:1;
}

.gallery-card:hover img,
.gallery-card:focus-visible img{
    filter:blur(2.5px) brightness(.58) saturate(.88);
    transform:scale(1.025);
}

.gallery-card-title{
    position:absolute;
    z-index:4;
    right:24px;
    bottom:20px;
    left:24px;
    color:#fff;
    font-family:"Steelfish","Arial Narrow",sans-serif;
    font-size:clamp(1.15rem,1.35vw,1.5rem);
    letter-spacing:.045em;
    line-height:1;
    text-transform:uppercase;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:opacity .3s ease,transform .3s ease;
}

.gallery-card:hover .gallery-card-title,
.gallery-card:focus-visible .gallery-card-title{
    opacity:1;
    transform:translateY(0);
}

/* WATER HOVER */

.water-ripple-video{
    position:absolute;
    z-index:2;
    inset:-3%;
    width:106%;
    height:106%;
    object-fit:cover;
    border-radius:inherit;
    opacity:0;
    mix-blend-mode:screen;
    filter:blur(1.4px) brightness(.78) contrast(.82);
    pointer-events:none;
    transform:scale(1.07);
    transition:opacity .48s ease,transform .85s ease;
}

.gallery-card.is-water-ripple .water-ripple-video{
    opacity:.16;
    transform:scale(1.09);
}

/* LIGHTBOX */

.lightbox{
    position:fixed;
    z-index:2200;
    inset:0;
    display:grid;
    place-items:center;
    padding:38px;
    background:rgba(0,0,0,.92);
    opacity:0;
    visibility:hidden;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    transition:opacity .28s ease,visibility .28s ease;
}

.lightbox.is-open{
    opacity:1;
    visibility:visible;
}

.lightbox-dialog{
    position:relative;
    width:min(1280px,94vw);
    height:min(88vh,900px);
    overflow:hidden;
    background:#0a0a0a;
    border-radius:26px;
    box-shadow:0 34px 110px rgba(0,0,0,.76);
}

.lightbox-media{
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    height:100%;
    padding:24px;
}

.lightbox-media img{
    width:auto;
    max-width:100%;
    height:auto;
    max-height:100%;
    object-fit:contain;
    border-radius:12px;
}

.lightbox-caption{
    position:absolute;
    z-index:4;
    right:30px;
    bottom:25px;
    left:30px;
    color:#fff;
    font-family:"Steelfish","Arial Narrow",sans-serif;
    font-size:clamp(1.25rem,1.8vw,1.6rem);
    letter-spacing:.045em;
    text-transform:uppercase;
    pointer-events:none;
}

.lightbox-close{
    position:absolute;
    z-index:6;
    top:18px;
    right:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    width:46px;
    height:46px;
    padding:0;
    color:#fff;
    background:rgba(5,5,5,.68);
    border:1px solid rgba(255,255,255,.28);
    border-radius:50%;
    cursor:pointer;
    font-size:1.3rem;
}

.lightbox-close:hover,
.lightbox-close:focus-visible{
    background:rgba(115,157,166,.62);
    transform:scale(1.06);
}

/* FOOTER */

.site-footer{
    padding:35px 0 45px;
    border-top:1px solid var(--line);
}

.footer-content{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:24px;
    color:#818181;
    font-size:.75rem;
    letter-spacing:.04em;
}

.footer-institution{
    display:flex;
    align-items:center;
    gap:18px;
}

.footer-ist-logo{
    width:auto;
    height:27px;
    opacity:.78;
    object-fit:contain;
}

/* RESPONSIVE */

@media(max-width:900px){
    :root{
        --content-gutter:36px;
        --gallery-gap:18px;
        --radius:20px;
    }
}

@media(max-width:700px){
    .gallery-layout--pair{
        grid-template-columns:1fr;
    }

    .gallery-layout--masonry{
        column-count:1;
    }

    .gallery-section-header{
        grid-template-columns:1fr;
        gap:14px;
    }

    .gallery-card-title{
        opacity:1;
        transform:none;
    }

    .gallery-card::after{
        opacity:.38;
    }
}

@media(max-width:520px){
    :root{
        --header-height:68px;
    }

    .main-nav{
        gap:13px;
        font-size:.94rem;
    }

    .header-logo-link{
        width:32px;
        height:42px;
        flex-basis:32px;
    }

    .header-logo-image{
        height:31px;
        max-width:30px;
    }

    .language-switch{
        right:-4px;
        transform:translate(35%,-50%) scale(.86);
    }

    .language-button{
        min-width:31px;
        padding:5px 6px;
        font-size:.8rem;
    }

    .footer-content{
        flex-direction:column;
        align-items:flex-start;
    }

    .lightbox{
        padding:14px;
    }

    .lightbox-dialog{
        width:100%;
        height:82vh;
        border-radius:19px;
    }
}

@media(hover:none){
    .water-ripple-video{
        display:none;
    }
}

@media(prefers-reduced-motion:reduce){
    *,
    *::before,
    *::after{
        scroll-behavior:auto!important;
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
    }

    .water-ripple-video{
        display:none;
    }
}
</style>
</head>

<div

            ×
        </button>

        <div class="lightbox-media"></div>
        <div class="lightbox-caption"></div>

    </div>

<script>
const SECTIONS = [
    {
        id:"virtual-environment",
        en:"Virtual Environment Construction",
        pt:"Construção do ambiente virtual",
        images:["4.1.jpg"]
    },
    {
        id:"characters-exploration",
        en:"Characters and Exploration Framework",
        pt:"Personagens e base para exploração",
        images:["4.2_1.jpg","4.2_2.jpg","4.2_3.jpg"]
    },
    {
        id:"menus-interface",
        en:"Menus and Interface",
        pt:"Menus e interface",
        images:["4.3_1.jpg","4.3_2.jpg"]
    },
    {
        id:"interaction-systems",
        en:"Interaction Systems",
        pt:"Sistemas de interação",
        images:[
            "4.4_1.jpg","4.4_2.jpg","4.4_3.jpg","4.4_4.jpg",
            "4.4_5.jpg","4.4_6.jpg","4.4_7.jpg"
        ]
    },
    {
        id:"xray-system",
        en:"X-Ray System",
        pt:"Sistema X-Ray",
        images:["4.5_1.jpg","4.5_2.jpg"]
    },
    {
        id:"maps-archive",
        en:"Maps and Archive",
        pt:"Mapas e arquivo",
        images:["4.6_1.jpg","4.6_2.jpg","4.6_3.jpg","4.6_4.jpg"]
    },
    {
        id:"clock-temporal-system",
        en:"Clock and Temporal System",
        pt:"Relógio e sistema temporal",
        images:["4.7_1.jpg","4.7_2.jpg","4.7_3.jpg","4.7_4.jpg"]
    },
    {
        id:"atmosphere-weather",
        en:"Atmosphere and Weather System",
        pt:"Atmosfera e sistema climático",
        images:["4.8_1.jpg","4.8_2.jpg","4.8_3.jpg","4.8_4.jpg"]
    },
    {
        id:"historical-system",
        en:"Historical System",
        pt:"Sistema Histórico",
        images:["4.9_1.jpg","4.9_2.jpg"]
    },
    {
        id:"sound-immersion",
        en:"Sound and Immersion",
        pt:"Som e imersão",
        images:["4.10_1.jpg","4.10_2.jpg"]
    },
    {
        id:"narrative-cutscene",
        en:"Narrative and Cutscene",
        pt:"Narrativa e Cutscene",
        images:["4.11_1.jpg","4.11_2.jpg"]
    },
    {
        id:"experience-modes",
        en:"Experience Modes",
        pt:"Modos da experiência",
        images:["4.12.jpg"]
    },
    {
        id:"optimization-preparation",
        en:"Optimization and Preparation for Use",
        pt:"Otimização e preparação para utilização",
        images:["4.13_1.jpg","4.13_2.jpg"]
    }
];

let currentLanguage = "en";

const gallery = document.querySelector("#gallerySections");
const lightbox = document.querySelector(".lightbox");
const lightboxMedia = document.querySelector(".lightbox-media");
const lightboxCaption = document.querySelector(".lightbox-caption");
const lightboxClose = document.querySelector(".lightbox-close");

const waterVideo = document.createElement("video");
waterVideo.className = "water-ripple-video";
waterVideo.src = "assets/media/water-ripple-overlay.mp4";
waterVideo.muted = true;
waterVideo.loop = true;
waterVideo.autoplay = true;
waterVideo.playsInline = true;
waterVideo.preload = "auto";
waterVideo.setAttribute("aria-hidden","true");

let activeWaterCard = null;
let waterTimer = null;
let lastFocusedCard = null;

function layoutClass(count){
    if(count === 1) return "gallery-layout--single";
    if(count === 2) return "gallery-layout--pair";
    return "gallery-layout--masonry";
}

function renderGallery(){
    gallery.innerHTML = SECTIONS.map(section => {
        const cards = section.images.map((file,index) => {
            const number = index + 1;
            const titleEn = `${section.en} — Image ${number}`;
            const titlePt = `${section.pt} — Imagem ${number}`;

            return `
                <button
                    class="gallery-card"
                    type="button"
                    data-title-en="${titleEn}"
                    data-title-pt="${titlePt}"
                >
                    <img
                        src="assets/images/gallery/${file}"
                        alt="${titleEn}"
                        loading="lazy"
                        decoding="async"
                    >

                    <span
                        class="gallery-card-title"
                        data-en="${titleEn}"
                        data-pt="${titlePt}"
                    >
                        ${currentLanguage === "pt" ? titlePt : titleEn}
                    </span>
                </button>
            `;
        }).join("");

        const title =
            currentLanguage === "pt"
                ? section.pt
                : section.en;

        return `
            <section
                class="gallery-section"
                id="${section.id}"
            >
                <header class="gallery-section-header">

                    <a
                        class="gallery-section-link"
                        href="#${section.id}"
                    >
                        <span>${title}</span>
                        <span class="arrow" aria-hidden="true">↗</span>
                    </a>

                    <span
                        class="gallery-section-line"
                        aria-hidden="true"
                    ></span>

                </header>

                <div
                    class="gallery-layout ${layoutClass(section.images.length)}"
                >
                    ${cards}
                </div>
            </section>
        `;
    }).join("");
}

function updateStaticLanguage(){
    document.documentElement.lang = currentLanguage;

    document
        .querySelectorAll("[data-en][data-pt]")
        .forEach(element => {
            element.textContent =
                element.dataset[currentLanguage];
        });

    document
        .querySelectorAll(".language-button")
        .forEach(button => {
            const active =
                button.dataset.language ===
                currentLanguage;

            button.classList.toggle(
                "is-active",
                active
            );

            button.setAttribute(
                "aria-pressed",
                active ? "true" : "false"
            );
        });
}

function setLanguage(language){
    currentLanguage = language;
    updateStaticLanguage();
    renderGallery();
}

document
    .querySelectorAll(".language-button")
    .forEach(button => {
        button.addEventListener(
            "click",
            () => setLanguage(
                button.dataset.language
            )
        );
    });

/* LIGHTBOX — event delegation */

gallery.addEventListener("click",event => {
    const card =
        event.target.closest(".gallery-card");

    if(!card) return;

    const source =
        card.querySelector("img");

    if(!source) return;

    lastFocusedCard = card;

    const title =
        currentLanguage === "pt"
            ? card.dataset.titlePt
            : card.dataset.titleEn;

    lightboxMedia.innerHTML = "";

    const image =
        document.createElement("img");

    image.src = source.src;
    image.alt = source.alt;

    lightboxMedia.appendChild(image);
    lightboxCaption.textContent = title;

    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden","false");

    document.body.style.overflow = "hidden";
    lightboxClose.focus();
});

function closeLightbox(){
    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden","true");

    document.body.style.overflow = "";
    lightboxMedia.innerHTML = "";

    if(lastFocusedCard){
        lastFocusedCard.focus();
    }
}

lightboxClose.addEventListener(
    "click",
    closeLightbox
);

lightbox.addEventListener(
    "click",
    event => {
        if(event.target === lightbox){
            closeLightbox();
        }
    }
);

document.addEventListener(
    "keydown",
    event => {
        if(
            event.key === "Escape" &&
            lightbox.classList.contains("is-open")
        ){
            closeLightbox();
        }
    }
);

/* WATER HOVER — event delegation */

gallery.addEventListener(
    "pointerover",
    event => {
        const card =
            event.target.closest(".gallery-card");

        if(!card) return;

        if(
            event.relatedTarget &&
            card.contains(event.relatedTarget)
        ){
            return;
        }

        clearTimeout(waterTimer);

        if(
            activeWaterCard &&
            activeWaterCard !== card
        ){
            activeWaterCard.classList.remove(
                "is-water-ripple"
            );
        }

        activeWaterCard = card;

        card.appendChild(waterVideo);
        card.classList.add(
            "is-water-ripple"
        );

        const attempt = waterVideo.play();

        if(attempt?.catch){
            attempt.catch(() => {});
        }
    }
);

gallery.addEventListener(
    "pointerout",
    event => {
        const card =
            event.target.closest(".gallery-card");

        if(!card) return;

        if(
            event.relatedTarget &&
            card.contains(event.relatedTarget)
        ){
            return;
        }

        if(activeWaterCard !== card){
            return;
        }

        card.classList.remove(
            "is-water-ripple"
        );

        waterTimer = setTimeout(() => {
            if(
                activeWaterCard === card &&
                waterVideo.parentElement === card
            ){
                waterVideo.remove();
                activeWaterCard = null;
            }
        },480);
    }
);

updateStaticLanguage();
renderGallery();
</script>
